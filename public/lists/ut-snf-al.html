<title>EON — Utah Call List (SNF & AL Administrators)</title>
<style>
 :root{--bg:#0A0F1A;--panel:#0E1420;--panel2:#121A28;--line:#243044;--line2:#2e3b52;--blue:#1A6ECC;--blue2:#3F8AE0;--gold:#F5B301;--text:#EEF3FA;--soft:#AEBBCD;--mut:#7E8DA0;--green:#46c46a;--shadow:0 2px 6px rgba(0,0,0,.35),0 16px 40px rgba(0,0,0,.4)}
 *{box-sizing:border-box}
 body{margin:0;background:radial-gradient(900px 440px at 82% -10%,rgba(26,110,204,.10),transparent 60%),var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;line-height:1.5;-webkit-font-smoothing:antialiased}
 .wrap{max-width:1000px;margin:0 auto;padding:16px 16px 60px}
 .top{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;padding:4px 0 14px}
 .top img{height:52px}
 .h{font-size:13px;color:var(--soft)}
 .tabs{display:inline-flex;background:var(--panel);border:1px solid var(--line2);border-radius:999px;padding:4px;gap:2px}
 .tabs button{border:0;background:transparent;color:var(--soft);font-weight:750;font-size:14px;padding:9px 18px;border-radius:999px;cursor:pointer}
 .tabs button.on{background:var(--blue);color:#fff}
 .bar{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin:14px 0}
 input[type=search]{flex:1;min-width:200px;background:#0a0f1a;border:1px solid var(--line2);color:var(--text);border-radius:10px;padding:11px 14px;font-size:15px}
 input::placeholder{color:var(--mut)}
 .prog{font-size:13px;color:var(--soft);white-space:nowrap}
 .prog b{color:var(--gold)}
 .resetbtn{background:transparent;border:1px solid var(--line2);color:var(--soft);border-radius:8px;padding:8px 12px;font-size:12.5px;cursor:pointer}
 .tscroll{overflow-x:auto;border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow)}
 table{width:100%;border-collapse:collapse;font-size:14px;min-width:640px;background:var(--panel)}
 thead th{text-align:left;padding:10px 12px;background:var(--panel2);border-bottom:1px solid var(--line);font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--soft);font-weight:700;position:sticky;top:0}
 tbody td{padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
 tbody tr.done{opacity:.4}
 tbody tr.done td.nm{text-decoration:line-through}
 tbody tr:hover{background:rgba(26,110,204,.08)}
 a.tel{color:var(--blue2);font-weight:800;font-variant-numeric:tabular-nums;text-decoration:none;white-space:nowrap}
 a.tel:hover{text-decoration:underline}
 .nm{font-weight:700}
 .sub{color:var(--mut);font-size:12px}
 /* CONTACT LINE. On the AL tab the administrator IS the name cell. On SNF the
    facility is, because that is how Jeff identifies the row — so the person is
    added beneath it rather than swapping it out. Net effect: on both tabs the
    human being is in column two, and the two pages read the same in the hand.
    Not muted like .sub: on paper this is the thing he is looking for. */
 .contact{font-weight:600;font-size:12.5px;color:var(--text);margin-top:2px}
 .contact .role{font-weight:400;color:var(--mut)}
 .contact a{color:var(--blue2);font-weight:400}
 .ck{width:18px;height:18px;cursor:pointer;accent-color:var(--green)}
 .foot{color:var(--mut);font-size:12px;margin-top:16px}
 .hint{color:var(--gold);font-size:12.5px;margin-top:6px}
 .nm{cursor:pointer;user-select:none}
 .nm:hover{color:var(--blue2)}
 .caret{color:var(--mut);font-size:12px;margin-left:6px}
 .cbadge{margin-left:8px;font-size:11px;color:var(--green);font-weight:800;white-space:nowrap}
 .ndot{margin-left:6px;font-size:11px}
 tr.detail td{background:#0a0f1a;border-bottom:1px solid var(--line)}
 .dwrap{display:flex;flex-direction:column;gap:8px;padding:2px 2px 10px}
 .dcall{font-size:12px;color:var(--soft);font-weight:600}
 .dnote{width:100%;min-height:70px;background:var(--panel);border:1px solid var(--line2);color:var(--text);border-radius:8px;padding:10px 12px;font-size:14.5px;font-family:inherit;resize:vertical;box-sizing:border-box}
 .dnote:focus{outline:none;border-color:var(--blue)}
 .ocsbtn{margin-left:10px;padding:3px 9px;font-size:11px;font-weight:800;letter-spacing:.03em;border-radius:6px;border:1px solid var(--blue);background:transparent;color:var(--blue2);cursor:pointer;vertical-align:middle}
 .ocsbtn:hover{background:rgba(26,110,204,.15)}
 .ocsbtn.on{border-color:var(--green);color:var(--green);background:rgba(70,196,106,.12);cursor:pointer}
 .ocsbtn.on:hover{background:rgba(224,85,107,.15);border-color:#e0556b;color:#e0556b}
 .act{white-space:nowrap;text-align:right}
 .actbtn{padding:5px 8px;font-size:14px;line-height:1;border-radius:6px;border:1px solid var(--line2);background:var(--panel2);cursor:pointer;margin-left:6px}
 .actbtn:hover{border-color:var(--blue)}
 .actbtn.note.has{border-color:var(--gold);background:rgba(245,179,1,.12)}
 .actbtn.trash:hover{border-color:#e0556b;background:rgba(224,85,107,.12)}
 .hlink{color:var(--gold);cursor:pointer;text-decoration:underline;margin-left:8px}
 thead th.sortable{cursor:pointer;user-select:none}
 thead th.sortable:hover{color:var(--text)}
 .sc{margin-left:6px;font-size:10px;color:var(--gold)}
 .sc.off{color:var(--mut);opacity:.45}


/* ── PRINT (table lists) ────────────────────────────────────────────────────
   Paper + phone. Interactive chrome stripped, inverted for ink, header row
   repeated on every sheet, and two hand-written columns added: a tick box and
   a ruled Notes column wide enough to actually write in. Names stay prominent
   because that is how a photographed page gets matched back to the record. */
@media print {
  @page { margin: 10mm 8mm; }
  html, body { background:#fff !important; color:#000 !important; }
  table, thead, tbody, tr, td, .tscroll, .wrap {
    background:#fff !important; background-image:none !important; box-shadow:none !important; }
  body { font-size:9.5pt; }
  .wrap { max-width:none !important; padding:0 !important; }
  .top, .tabs, .hint, .bar, .foot, button, .actbtn, input, .pbtn { display:none !important; }
  img.logo, .logo { width:140px !important; filter:grayscale(1) contrast(2); }
  h1, .h { font-size:14pt !important; color:#000 !important; margin:0 0 6pt !important; }
  .tscroll { overflow:visible !important; border:0 !important; }
  table { width:100% !important; border-collapse:collapse !important; font-size:9pt !important; }
  thead { display: table-header-group; }
  th { background:#eee !important; color:#000 !important; border-bottom:1.5pt solid #000 !important;
       padding:3pt 4pt !important; font-size:7.5pt !important; }
  td { border-bottom:1px solid #ccc !important; padding:4pt !important; color:#000 !important;
       vertical-align:top; }
  tr { break-inside:avoid; page-break-inside:avoid; }
  /* The administrator must survive to paper. Jeff hand-wrote Braden, Dave
     Markley and Jeff Perkins into the margin of the 8/17 printout and opened
     calls with "who is your administrator at that location?" — the name was in
     the data and the SNF tab never rendered it. */
  .contact { display:block !important; color:#000 !important; font-size:8.5pt !important;
             font-weight:700 !important; margin-top:1pt !important; }
  .contact .role { font-weight:400 !important; color:#333 !important; }
  .contact a { color:#000 !important; }
  a { color:#000 !important; text-decoration:none !important; }
  /* hand-written columns */
  thead tr th:first-child::before { content:"\2713 "; }
  tbody tr td:first-child::before { content:"\2610  "; font-size:11pt; }
  thead tr::after { content:"NOTES"; display:table-cell; border-bottom:1.5pt solid #000;
                    font-size:7.5pt; padding:3pt 4pt; width:34%; }
  tbody tr::after { content: attr(data-note); display:table-cell; border-bottom:1px solid #ccc;
                    border-left:1px solid #ddd; width:34%; font-size:8.5pt; padding:4pt;
                    white-space:pre-wrap; vertical-align:top; }
  .printhdr { display:block !important; font-size:8pt; color:#333; margin-bottom:6pt; }
}
.printhdr { display:none; }
.pbtn{appearance:none;border:1px solid #2e3b52;background:#0b1220;color:#3F8AE0;font-size:13px;font-weight:700;padding:9px 14px;border-radius:8px;cursor:pointer;margin:6px 0 4px;min-height:40px}
 .pbtn:hover{border-color:#1A6ECC}
</style>

 function key(row){return tab+'|'+(row.d||'')+'|'+(row.f||'');}
 function calledVal(row){return localStorage.getItem('called:'+key(row));}
 function isDone(row){return calledVal(row)!==null;}
 function toggle(i){var row=cur()[i];var k='called:'+key(row);if(localStorage.getItem(k)!==null)localStorage.removeItem(k);else localStorage.setItem(k,new Date().toISOString());render();}
 function cur(){return tab==='al'?AL:SNF;}
 function setTab(t){tab=t;openKey=null;showHidden=false;sortKey=null;document.getElementById('tAL').classList.toggle('on',t==='al');document.getElementById('tSNF').classList.toggle('on',t==='snf');render();}
 function resetCalled(){if(!confirm('Clear all checkmarks for this list? (Your notes are kept.)'))return;cur().forEach(function(r){localStorage.removeItem('called:'+key(r));});render();}
 function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
 var LIST='ut-snf-al';
 var NOTES={};            // person_key -> note text (server is source of truth once hydrated)
 var noteTimers={};       // per-key debounce timers so different people don't collide
 function getNote(row){var k=key(row);if(NOTES.hasOwnProperty(k))return NOTES[k]||'';return localStorage.getItem('note:'+k)||'';}
 function sendNote(k,v){fetch('/api/crm/call-list-note',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({list:LIST,key:k,note:v})}).catch(function(){/* localStorage already holds it; retry on blur */});}
 function pushNote(k,v){if(noteTimers[k])clearTimeout(noteTimers[k]);noteTimers[k]=setTimeout(function(){noteTimers[k]=null;sendNote(k,v);},600);}
 function flushNote(i){var k=key(cur()[i]);if(noteTimers[k]){clearTimeout(noteTimers[k]);noteTimers[k]=null;}sendNote(k,getNote(cur()[i]));}
 function saveNote(i,v){var k=key(cur()[i]);if(v){NOTES[k]=v;try{localStorage.setItem('note:'+k,v);}catch(e){}}else{delete NOTES[k];try{localStorage.removeItem('note:'+k);}catch(e){}}var d=document.getElementById('nd'+i);if(d)d.className='actbtn note'+(v?' has':'');pushNote(k,v);}
 function toggleNote(i){var k=key(cur()[i]);openKey=(openKey===k)?null:k;render();}
 function ocsDone(row){return localStorage.getItem('ocs:'+key(row))==='1';}
 function createOCS(i){var r=cur()[i];var k=key(r);var on=ocsDone(r);var btn=document.getElementById('ocs'+i);
   if(on&&!confirm('Remove '+((tab==='al'?r.a:r.f)||'this person')+' from the CRM?'))return;
   if(btn){btn.textContent='…';btn.disabled=true;}
   var payload=on?{action:'remove',key:k}:{list:'ut-snf-al',tab:tab,key:k,name:(tab==='al'?r.a:r.f),phone:r.p,facility:r.f,city:r.c};
   fetch('/api/crm/call-list-card',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)})
     .then(function(res){return res.json().catch(function(){return {};}).then(function(j){return {ok:res.ok,j:j};});})
     .then(function(o){if(o.ok&&o.j&&o.j.ok){if(on)localStorage.removeItem('ocs:'+k);else localStorage.setItem('ocs:'+k,'1');render();}else{alert('Could not update the OCS card: '+((o.j&&o.j.error)||'server error'));if(btn){btn.textContent=on?'✓ OCS':'OCS';btn.disabled=false;}}})
     .catch(function(){alert('Network error. Check your connection and try again.');if(btn){btn.textContent=on?'✓ OCS':'OCS';btn.disabled=false;}});
 }
 function isHidden(row){return localStorage.getItem('hidden:'+key(row))==='1';}
 function hideRow(i){var r=cur()[i];if(!confirm('Remove '+((tab==='al'?r.a:r.f)||'this person')+' from the list?'))return;localStorage.setItem('hidden:'+key(r),'1');if(openKey===key(r))openKey=null;render();}
 function restoreRow(i){localStorage.removeItem('hidden:'+key(cur()[i]));render();}
 function toggleHidden(){showHidden=!showHidden;openKey=null;render();}
 function fmtShort(v){try{return new Date(v).toLocaleDateString(undefined,{month:'short',day:'numeric'});}catch(e){return '';}}
 function fmtFull(v){try{return new Date(v).toLocaleString(undefined,{weekday:'short',month:'short',day:'numeric',hour:'numeric',minute:'2-digit'});}catch(e){return v;}}
 /* ── Sorting ───────────────────────────────────────────────────────────────
    Sorts the DISPLAY array only. Each entry keeps its source index i, and the
    row keys stay tab+d+f, so called/notes/OCS state is unaffected by order.
    Beds are numbers on AL (cap) but strings on SNF (b), so coerce before
    comparing — otherwise "99" would sort above "106". */
 var sortKey=null,sortDir=-1;
 function bedsVal(r){var v=parseFloat(tab==='al'?r.cap:r.b);return isNaN(v)?null:v;}
 function setSort(k){
   if(sortKey!==k){sortKey=k;sortDir=-1;}        // first tap = biggest first
   else if(sortDir===-1){sortDir=1;}             // second tap = smallest first
   else {sortKey=null;sortDir=-1;}               // third tap = back to default order
   openKey=null;render();
 }
 function cmpRows(a,b){
   var x=bedsVal(a.r),y=bedsVal(b.r);
   if(x===null&&y===null)return 0; if(x===null)return 1; if(y===null)return -1;  // blanks always last
   return sortDir*(x<y?-1:x>y?1:0);
 }
 function sc(k){return sortKey===k?'<span class="sc">'+(sortDir===1?'▲':'▼')+'</span>':'<span class="sc off">↕</span>';}
 function render(){
   var q=(document.getElementById('q').value||'').toLowerCase();
   var data=cur().map(function(r,i){return {r:r,i:i};});
   var rows=data.filter(function(x){var r=x.r;if(isHidden(r)!==showHidden)return false;return !q || ((r.a||'')+' '+(r.f||'')+' '+(r.c||'')).toLowerCase().indexOf(q)>=0;});
   if(sortKey)rows.sort(cmpRows);
   var vis=cur().filter(function(r){return !isHidden(r);});
   var done=vis.filter(isDone).length;var hid=cur().length-vis.length;
   var prog='<b>'+done+'</b> called · '+(vis.length-done)+' left · '+rows.length+' shown';
   if(hid>0||showHidden)prog+='<span class="hlink" onclick="toggleHidden()">'+(showHidden?'← back to list':hid+' removed')+'</span>';
   document.getElementById('prog').innerHTML=prog;
   var th=tab==='al'
     ? '<tr><th style="width:34px"></th><th>Administrator</th><th>Phone</th><th>Facility</th><th>City</th><th class="sortable" onclick="setSort(\'beds\')">Beds'+sc('beds')+'</th><th></th></tr>'
     : '<tr><th style="width:34px"></th><th>Facility</th><th>Phone</th><th>City</th><th class="sortable" onclick="setSort(\'beds\')">Beds'+sc('beds')+'</th><th>Chain</th><th></th></tr>';
   document.getElementById('thead').innerHTML=th;
   document.getElementById('hint').textContent = showHidden ? 'Removed people — tap ↩ to put someone back on the list.' : (tab==='snf' ? 'SNF: call the facility and ask for the Administrator. OCS = add to CRM · 📝 = note · 🗑 = remove.' : 'OCS = add to CRM · 📝 = note · 🗑 = remove.');
   var html=rows.map(function(x){var r=x.r,i=x.i;var k=key(r);var dn=isDone(r)?' class="done"':'';
     var tel='<a class="tel" href="tel:+1'+r.d+'">'+r.p+'</a>';
     var ck='<input type="checkbox" class="ck" '+(isDone(r)?'checked':'')+' onchange="toggle('+i+')">';
     var cv=calledVal(r);
     var badge=(cv&&cv!=='1')?'<span class="cbadge">✓ '+fmtShort(cv)+'</span>':(cv==='1'?'<span class="cbadge">✓</span>':'');
     var od=ocsDone(r);
     var ocs='<button class="ocsbtn'+(od?' on':'')+'" id="ocs'+i+'" title="'+(od?'In CRM — click to remove':'Add to CRM (Action Needed)')+'" onclick="createOCS('+i+')">'+(od?'✓ OCS':'OCS')+'</button>';
     var nmVal=(tab==='al')?esc(r.a):esc(r.f);
     // The AL tab already shows the administrator as the name. The SNF tab shows
     // the facility, so add the person underneath when we have one. Email renders
     // on either tab whenever an `e` field exists — no row has one today, and
     // that is exactly why it is wired now rather than after someone adds one.
     var cbits=[];
     if(tab!=='al'&&r.a)cbits.push('<span class="role">Administrator:</span> '+esc(r.a));
     if(r.e)cbits.push('<a href="mailto:'+esc(r.e)+'">'+esc(r.e)+'</a>');
     var contact=cbits.length?'<div class="contact">'+cbits.join(' \u00b7 ')+'</div>':'';
     var nm='<td class="nm">'+nmVal+badge+ocs+contact+'</td>';
     var acts=showHidden
       ? '<button class="actbtn" title="Put back" onclick="restoreRow('+i+')">↩</button>'
       : '<button class="actbtn note'+(getNote(r)?' has':'')+'" id="nd'+i+'" title="Notes" onclick="toggleNote('+i+')">📝</button><button class="actbtn trash" title="Remove" onclick="hideRow('+i+')">🗑</button>';
     var act='<td class="act">'+acts+'</td>';
     var main=(tab==='al')
       ? '<tr'+dn+' data-note="'+esc(getNote(r)||'')+'"><td>'+ck+'</td>'+nm+'<td>'+tel+'</td><td>'+esc(r.f)+'</td><td>'+esc(r.c)+'</td><td class="sub">'+esc(r.cap||'')+'</td>'+act+'</tr>'
       : '<tr'+dn+' data-note="'+esc(getNote(r)||'')+'"><td>'+ck+'</td>'+nm+'<td>'+tel+'</td><td>'+esc(r.c)+'</td><td class="sub">'+esc(r.b||'')+'</td><td class="sub">'+esc(r.ch||'')+'</td>'+act+'</tr>';
     if(k===openKey){
       var cl=(cv&&cv!=='1')?('Called '+fmtFull(cv)):(cv==='1'?'Called':'Not called yet');
       main+='<tr class="detail"><td colspan="7"><div class="dwrap"><div class="dcall">'+cl+'</div>'
           +'<textarea class="dnote" placeholder="Notes for this person — who you spoke with, follow-up, best time to reach…" oninput="saveNote('+i+',this.value)" onblur="flushNote('+i+')">'+esc(getNote(r))+'</textarea></div></td></tr>';
     }
     return main;
   }).join('');
   document.getElementById('tbody').innerHTML=html;
 }
 var openKey=null;
 var showHidden=false;
 render();          // instant render from localStorage (works offline, before the fetch resolves)
 hydrateNotes();    // then pull server notes (canonical) and migrate any local-only notes up
 function hydrateNotes(){
   fetch('/api/crm/call-list-note?list='+encodeURIComponent(LIST))
     .then(function(res){return res.json();})
     .then(function(j){
       var server=(j&&j.ok&&j.notes)?j.notes:{};
       for(var sk in server){if(Object.prototype.hasOwnProperty.call(server,sk)){NOTES[sk]=server[sk];try{localStorage.setItem('note:'+sk,server[sk]);}catch(e){}}}
       migrateLocalNotes(server);   // one-time: push this browser's local-only notes to the server
       render();
     })
     .catch(function(){/* offline: localStorage already drives the UI */});
 }
 var migrated=false;
 function migrateLocalNotes(server){
   if(migrated)return;migrated=true;
   try{
     for(var i=0;i<localStorage.length;i++){
       var lk=localStorage.key(i);
       if(!lk||lk.indexOf('note:')!==0)continue;
       var pk=lk.slice(5);
       if(!pk)continue;
       var lv=localStorage.getItem(lk)||'';
       if(!lv.trim())continue;
       if(server&&server[pk]&&String(server[pk]).trim())continue;  // server wins when it already has a note
       NOTES[pk]=lv;
       sendNote(pk,lv);
     }
   }catch(e){/* ignore malformed keys / storage errors */}
 }
