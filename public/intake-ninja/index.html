<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow, noarchive">
<title>Intake Ninja — NTA capture prototype (sample data)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700&display=swap" rel="stylesheet">
<style>
/* ============================================================
   Intake Ninja — prototype
   Presentation lives here. The data model in the script block carries no
   styling decisions, so this stylesheet can be replaced wholesale
   when Evelyn's competitor research lands.
   ============================================================ */
:root{
  /* Locked EnhancedOps.Ninja palette. Backgrounds are ALWAYS dark, never white. */
  --bg:#0A0F1A;            /* page ground */
  --panel:#0E1420;         /* cards */
  --panel-2:#131b2b;       /* raised / nested */
  --line:#243044;          /* hairline */
  --line-2:#31415c;        /* stronger divider */

  --text:#EEF3FA;          /* primary */
  --text-2:#AEBBCD;        /* secondary */
  --text-3:#7E8DA0;        /* tertiary / meta */

  --blue:#1A6ECC;          /* primary brand */
  --blue-lt:#3F8AE0;       /* emphasis, links, focus */
  --blue-soft:rgba(26,110,204,.16);
  --gold:#F5B301;          /* SECONDARY ACCENT ONLY — badges and pills */
  --gold-soft:rgba(245,179,1,.14);

  --ok:#3FBF87;            /* lifted for contrast on dark */
  --ok-soft:rgba(63,191,135,.13);
  --no:#FF6B61;            /* lifted for contrast on dark */
  --no-soft:rgba(255,107,97,.12);
  --warn:#F5B301;

  --r:12px; --pad:16px;
  /* Headings Bebas Neue (condensed all-caps, needs positive tracking).
     Body DM Sans. No system monospace anywhere in the app chrome. */
  --head:'Bebas Neue',Impact,sans-serif;
  --body:'DM Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--body);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased}
h1,h2,h3,.h{font-family:var(--head);font-weight:400;letter-spacing:.02em;margin:0}
.sec-h,.mark,.band .pts,.band .code,.find .pts{letter-spacing:.02em}
button{font:inherit;cursor:pointer}
code{font-family:var(--body);font-weight:700;letter-spacing:.03em;font-size:.94em;color:var(--blue-lt)}

/* ---------- sample-data banner: must be unmissable on every screen ---------- */
.sample-banner{position:sticky;top:0;z-index:60;background:var(--gold);color:#241a00;
  font-weight:700;font-size:13px;letter-spacing:.06em;text-transform:uppercase;
  text-align:center;padding:7px 12px;border-bottom:2px solid #c99400}

/* ---------- app bar ---------- */
.appbar{position:sticky;top:31px;z-index:50;background:var(--panel);border-bottom:1px solid var(--line);
  display:flex;align-items:center;gap:12px;padding:10px var(--pad)}
/* The wide lockup IS the wordmark — never a text wordmark beside it, and never
   the square logo shrunk into a nav, which goes illegible. */
.appbar .logo{width:280px;max-width:290px;height:auto;object-fit:contain;display:block}
.appbar .prod{font-family:var(--head);font-size:19px;line-height:1;color:var(--text-2);
  letter-spacing:.06em;text-transform:uppercase;padding-left:14px;margin-left:2px;
  border-left:1px solid var(--line-2)}
@media (max-width:560px){.appbar .logo{width:200px}.appbar .prod{display:none}}
.appbar .spacer{flex:1}
.btn{border:1px solid var(--line);background:var(--panel);color:var(--text-2);border-radius:10px;
  padding:9px 13px;font-size:14px;font-weight:500;min-height:44px;display:inline-flex;align-items:center;gap:7px}
.btn:hover{border-color:var(--blue-lt);color:var(--blue-lt)}
.btn.primary{background:var(--blue);border-color:var(--blue-lt);color:#fff}
.btn.primary:hover{background:var(--blue-lt);color:#fff}

/* ---------- tabs ---------- */
.tabs{display:flex;gap:6px;padding:10px var(--pad) 0;background:var(--panel);border-bottom:1px solid var(--line);
  overflow-x:auto;-webkit-overflow-scrolling:touch;position:sticky;top:82px;z-index:45}
.tab{border:0;background:transparent;color:var(--text-3);font-weight:500;font-size:15px;
  padding:10px 12px;border-bottom:3px solid transparent;white-space:nowrap;min-height:44px}
.tab.on{color:var(--blue-lt);border-bottom-color:var(--blue-lt)}
.tab .pill{display:inline-block;min-width:20px;padding:0 6px;margin-left:6px;border-radius:999px;
  background:var(--bg);color:var(--text-3);font-size:12px;font-weight:700;line-height:19px;text-align:center}
.tab.on .pill{background:var(--blue-soft);color:var(--blue-lt)}

main{max-width:940px;margin:0 auto;padding:var(--pad) var(--pad) 96px}

/* ---------- BAND DISPLAY — hero. Nobody else shows this. ---------- */
.band{background:var(--panel-2);color:var(--text);border-radius:var(--r);
  border:1px solid var(--line-2);border-left:4px solid var(--blue);
  padding:18px 18px 16px;margin-bottom:14px}
.band .lede{font-size:12px;letter-spacing:.10em;text-transform:uppercase;color:var(--text-3);font-weight:700}
.band .row{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;margin-top:6px}
.band .pts{font-family:var(--head);font-size:52px;line-height:.9}
.band .code{font-family:var(--head);font-size:52px;line-height:.9;color:var(--blue-lt)}
.band .code small{font-family:var(--body);font-size:13px;font-weight:700;letter-spacing:.08em;
  display:block;opacity:.8;color:#fff}
.band .next{margin-top:12px;background:var(--blue-soft);border:1px solid var(--line-2);
  border-radius:9px;padding:11px 13px;font-size:15px;font-weight:500;color:var(--text)}
.band .next b{color:var(--blue-lt)}
.band .ladder{display:flex;gap:4px;margin-top:12px}
.band .rung{flex:1;text-align:center;font-size:11px;font-weight:700;letter-spacing:.05em;
  padding:5px 2px;border-radius:6px;background:var(--panel);color:var(--text-3)}
.band .rung.on{background:var(--gold);color:#241a00;opacity:1}
.band .caution{margin-top:10px;font-size:12.5px;color:var(--text-2);line-height:1.45}

/* ---------- finding rows ---------- */
.sec-h{font-family:var(--head);font-size:20px;color:var(--text-2);margin:18px 0 8px;letter-spacing:.03em}
/* ---------- finding rows — dense, scannable, one line ----------
   A list she can run her eye down and COMPARE, not eight cards she has to
   read sequentially. The quote is the ONLY flexible column; everything else
   is fixed so the columns line up down the page. ------------------------- */
.rows{border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:var(--panel)}
.find{display:grid;
  grid-template-columns:46px minmax(120px,168px) minmax(0,1fr) 118px auto;
  align-items:center;gap:10px;padding:0 12px;min-height:52px;
  border-top:1px solid var(--line);cursor:pointer;
  transition:background .12s ease}
.find:first-child{border-top:0}
.find:hover{background:var(--panel-2)}
.find.open{background:var(--panel-2)}
/* settled rows read quieter than pending ones, without shouting */
.find.done{background:rgba(63,191,135,.05)}
.find.done .label{color:var(--text-2)}
.find.rej{background:rgba(255,107,97,.045)}
.find.rej .label,.find.rej .q{color:var(--text-3);text-decoration:line-through}

/* points: tabular so the column does not jitter */
.find .pts{font-family:var(--head);font-size:24px;line-height:1;color:var(--blue-lt);
  text-align:right;font-variant-numeric:tabular-nums;font-feature-settings:"tnum" 1}
.find .pts i{font-family:var(--body);font-style:normal;font-size:10px;font-weight:700;
  color:var(--text-3);letter-spacing:.06em;margin-left:3px}

.find .label{font-weight:700;font-size:14.5px;line-height:1.25;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* the only column allowed to shrink */
.find .q{font-size:13.5px;color:var(--text-2);font-style:italic;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}

/* fixed, never truncates — a cut-off citation is worse than none */
.find .cit{font-size:12.5px;color:var(--text-3);white-space:nowrap;text-align:right}
.find .cit b{color:var(--blue-lt);font-weight:700}

.find .acts{display:flex;gap:6px;justify-self:end}
.find .acts .btn{min-height:38px;padding:6px 10px;font-size:13px;border-radius:8px}
.find .acts .state{font-size:12px;padding:5px 9px}

/* expanded detail — full quote, the caveat, and the reason chips */
.detail{grid-column:1/-1;padding:2px 0 14px;border-top:1px dashed var(--line-2);margin-top:2px}
.detail .full{font-size:14.5px;line-height:1.55;color:var(--text);font-style:italic;
  border-left:3px solid var(--blue);background:var(--blue-soft);
  padding:9px 12px;border-radius:0 8px 8px 0;margin:10px 0 8px}
.detail .meta{font-size:12.5px;color:var(--text-3)}
.detail .meta b{color:var(--text-2)}
/* the caveat is the trap the whole test is built on — it must not get buried */
.caveat{margin:10px 0 0;background:var(--gold-soft);border:1px solid var(--line-2);
  border-left:4px solid var(--gold);border-radius:0 8px 8px 0;padding:10px 12px;
  font-size:13.5px;color:var(--text);line-height:1.5}
.caveat b{color:var(--gold)}
.rowhint{font-size:12px;color:var(--text-3);margin:6px 2px 10px}

@media (max-width:700px){
  /* Below iPad portrait the five columns cannot hold. Documented, not silent:
     the row goes two-tier rather than truncating the citation. */
  .find{grid-template-columns:46px minmax(0,1fr) auto;row-gap:2px;padding:9px 12px}
  .find .q{grid-column:2/-1;order:3}
  .find .cit{grid-column:2;order:4;text-align:left}
  .find .acts{grid-column:3;order:5}
}

/* ---------- reject: inline, 2 taps, never a blocking modal ---------- */
.rej-panel{margin-top:11px;border-top:1px dashed var(--line);padding-top:11px}
.rej-panel .ask{font-size:13.5px;font-weight:700;color:var(--text-2);margin-bottom:8px}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{border:1px solid var(--line-2);background:var(--panel-2);border-radius:999px;padding:9px 13px;
  font-size:14px;color:var(--text-2);min-height:44px;display:inline-flex;align-items:center}
.chip:hover,.chip.on{border-color:var(--no);background:var(--no);color:#12060a}
.rej-panel textarea{width:100%;margin-top:8px;border:1px solid var(--line-2);border-radius:9px;
  padding:10px;font:inherit;font-size:16px;min-height:56px;resize:vertical;
  background:var(--panel-2);color:var(--text)}
.muted{color:var(--text-3);font-size:13px}

/* ---------- gaps: what we did NOT find ---------- */
.gap{background:var(--gold-soft);border:1px solid var(--line-2);border-left:4px solid var(--gold);
  border-radius:var(--r);padding:13px 14px;margin-bottom:10px}
.gap .t{font-weight:700;margin-bottom:3px}
.gap .w{font-size:14px;color:var(--text-2)}
.gap .t{color:var(--text)}

/* ---------- page viewer ---------- */
.sheet{position:fixed;inset:0;z-index:100;background:rgba(15,23,36,.55);display:none;
  align-items:flex-end;justify-content:center}
.sheet.on{display:flex}
.sheet .inner{background:var(--panel);width:100%;max-width:940px;max-height:92vh;border-radius:16px 16px 0 0;
  display:flex;flex-direction:column}
.sheet .bar{display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px solid var(--line)}
.sheet .bar .t{font-weight:700;flex:1;min-width:0}
.sheet .doc{overflow:auto;padding:18px;background:var(--panel-2)}
.page{background:#FBFBF8;border:1px solid #d8d8cf;border-radius:4px;padding:26px 28px;
  font-family:var(--body);font-size:14px;line-height:1.7;color:#171A1F;
  letter-spacing:.008em;box-shadow:0 2px 14px rgba(0,0,0,.35)}
.page .ph{font-family:var(--body);font-size:11px;letter-spacing:.09em;text-transform:uppercase;
  color:#5C6270;border-bottom:1px solid #d8d8cf;padding-bottom:7px;margin-bottom:14px;
  display:flex;justify-content:space-between;gap:10px}
.page mark{background:var(--gold);color:#241a00;font-weight:700;padding:1px 2px}
.page .pf{margin-top:18px;border-top:1px solid #d8d8cf;padding-top:7px;
  font-family:var(--body);font-size:11px;color:#5C6270;text-align:center}

/* ---------- artefact ---------- */
.art{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:18px;margin-bottom:12px}
.art h3{font-size:19px;color:var(--text);margin-bottom:4px}
.art .sub{font-size:13px;color:var(--text-3);margin-bottom:12px}
.item{border-top:1px solid var(--line);padding:11px 0}
.item:first-of-type{border-top:0}
.item .l{font-weight:700}
.wk{width:100%;border-collapse:collapse;font-size:14px}
.wk th,.wk td{text-align:left;padding:8px 8px;border-bottom:1px solid var(--line);vertical-align:top}
.wk th{font-size:11.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--text-3)}
.scroll-x{overflow-x:auto}

.never{background:var(--panel-2);border:1px dashed var(--line-2);border-radius:var(--r);padding:13px 14px;
  font-size:13.5px;color:var(--text-2);margin-top:14px}
.never b{color:var(--text)}

.note-line{font-size:12.5px;color:var(--text-3);background:var(--panel);border:1px solid var(--line);
  border-radius:10px;padding:9px 12px;margin-bottom:12px}

.footer-tools{max-width:940px;margin:0 auto;padding:0 var(--pad) 36px;
  display:flex;gap:12px;flex-wrap:wrap;align-items:center;justify-content:space-between;
  font-size:12px;color:var(--text-3);line-height:1.5}
.footer-tools a{color:var(--text-3);text-decoration:underline;text-underline-offset:3px}
.footer-tools a:hover{color:var(--blue-lt)}
.empty{color:var(--text-3);font-size:15px;padding:22px;text-align:center;
  background:var(--panel);border:1px dashed var(--line);border-radius:var(--r)}

textarea,input,select{font-family:inherit}
.field{display:block;margin-bottom:11px}
.field span{display:block;font-size:13px;font-weight:700;color:var(--text-2);margin-bottom:5px}
.field input,.field select,.field textarea{width:100%;border:1px solid var(--line-2);border-radius:9px;
  padding:11px;font-size:16px;min-height:44px;background:var(--panel-2);color:var(--text)}

.exportbox{width:100%;min-height:210px;border:1px solid var(--line);border-radius:9px;padding:11px;
  background:var(--panel-2);color:var(--text-2);font-family:var(--body);font-size:12.5px;
  letter-spacing:.01em;white-space:pre;line-height:1.55}

@media (max-width:600px){
  .band .pts,.band .code{font-size:42px}
  main{padding-left:12px;padding-right:12px}
}
/* ---------- PRINT: this is the deliverable ----------
   Chrome's print-to-PDF is the tool. The output is a WORKSHEET she keys FROM,
   never a submission. Two sections: the MDS worksheet in MDS-ITEM order
   (data-entry order, the order she goes down her EHR screen), then the
   evidence packet in the order a reviewer reads it. ---------------------- */
@media print{
  @page{ margin:14mm 12mm 16mm; }
  html,body{background:#fff!important;color:#000!important}
  .appbar,.tabs,.acts,.sheet,.rowhint,.note-line,.btn,.chips,.rej-panel,
  #addmiss,.band .ladder,.footer-tools{display:none!important}
  .sample-banner{display:none!important}

  /* banner and footer repeat on EVERY printed page via a running header */
  .printdoc{display:block!important}
  .printdoc .ph-banner{background:#F5B301!important;color:#241a00!important;
    -webkit-print-color-adjust:exact;print-color-adjust:exact;
    text-align:center;font-weight:700;font-size:9pt;letter-spacing:.08em;
    text-transform:uppercase;padding:5pt;margin-bottom:8pt;border:1pt solid #c99400}
  .printdoc h1{font-family:var(--head);font-size:20pt;color:#000!important;margin:0 0 2pt}
  .printdoc h2{font-family:var(--head);font-size:14pt;color:#000!important;
    margin:14pt 0 5pt;border-bottom:1.5pt solid #000;padding-bottom:2pt;
    break-after:avoid;page-break-after:avoid}
  .printdoc h3{font-size:10.5pt;margin:9pt 0 3pt;break-after:avoid}
  .printdoc,.printdoc *{color:#000!important;background:transparent!important}
  .printdoc .sub{font-size:9pt;color:#333!important;margin-bottom:8pt}
  .printdoc table{width:100%;border-collapse:collapse;font-size:9.5pt;margin-bottom:6pt}
  .printdoc th,.printdoc td{border:0.6pt solid #444;padding:4pt 5pt;text-align:left;vertical-align:top}
  .printdoc th{background:#eee!important;-webkit-print-color-adjust:exact;print-color-adjust:exact;
    font-size:8pt;letter-spacing:.05em;text-transform:uppercase}
  .printdoc .ev{border-top:0.6pt solid #999;padding:6pt 0;break-inside:avoid;page-break-inside:avoid}
  .printdoc .ev .l{font-weight:700;font-size:10.5pt}
  .printdoc .ev .c{font-size:9.5pt;margin-top:2pt}
  .printdoc .ev .c i{font-style:italic}
  .printdoc .ev .why{font-size:9.5pt;margin-top:3pt}
  .printdoc .sig{margin-top:16pt;border-top:1pt solid #000;padding-top:6pt;font-size:9pt}
  .printdoc .foot{margin-top:12pt;border-top:1.5pt solid #000;padding-top:5pt;
    font-size:8.5pt;line-height:1.4}
  main{padding:0!important;max-width:none!important}
  #main{display:none!important}
}
/* the print document is built into the DOM but never shown on screen */
.printdoc{display:none}
</style>
</head>
<body>
<div class="sample-banner">Sample data — fictional patient — not a real record</div>

<header class="appbar">
  <img class="logo" src="/ninja-logo.png" alt="EnhancedOps.Ninja">
  <div class="prod">Intake Ninja</div>
  <div class="spacer"></div>
  <button class="btn primary" id="printBtn">Save as PDF</button>
</header>

<nav class="tabs" id="tabs"></nav>
<main id="main"></main>
<div class="printdoc" id="printdoc"></div>
<footer class="footer-tools">
  <span>Sample data — fictional patient. This session records your choices and timing so we can
    improve the tool.</span>
  <a href="#" id="researchLink">Session data for the build team</a>
</footer>

<div class="sheet" id="sheet"><div class="inner">
  <div class="bar"><div class="t" id="sheetTitle"></div>
    <button class="btn" onclick="closeSheet()">Close</button></div>
  <div class="doc" id="sheetDoc"></div>
</div></div>

<script>
/* ================================================================
   DATA MODEL
   No presentation decisions live in here. Every string below is
   content or clinical fact; how it is drawn is entirely the CSS and
   the render functions. Evelyn's competitor research can restyle the
   finding row and the band display without touching this section.
   ================================================================ */

/* --- ALL PATIENT CONTENT BELOW IS INVENTED. There is no real person,
       no real facility, no redacted real document. Identifiers are
       deliberately malformed so they cannot resemble a real record. --- */
const PATIENT = {
  name: 'HOLLOWAY, MARGARET T. (FICTIONAL)',
  mrn: 'SAMPLE-000-0000',
  dob: '01/01/1900 (placeholder)',
  from: 'Northgate Regional Medical Center (fictional)',
  to: 'Cedar Hollow Post-Acute (fictional)',
  packetPages: 60,
  received: 'Referral packet received by fax, 62 pages, scanned image'
};

/* NTA case-mix bands. Verified against the CGS Medicare PDPM deck and
   the CMS NTA fact-sheet table: NA 12+, NB 9-11, NC 6-8, ND 3-5,
   NE 1-2, NF 0. Case-mix index included because it is the reason a
   boundary is worth money and a point inside a band is worth nothing. */
const BANDS = [
  { code:'NA', min:12, max:Infinity, cmi:3.25 },
  { code:'NB', min:9,  max:11,       cmi:2.53 },
  { code:'NC', min:6,  max:8,        cmi:1.85 },
  { code:'ND', min:3,  max:5,        cmi:1.34 },
  { code:'NE', min:1,  max:2,        cmi:0.96 },
  { code:'NF', min:0,  max:0,        cmi:0.72 }
];

/* Rejection reasons. Order matters: most-used first, so the common
   case is one tap. */
const REASONS = [
  'Not supported in the record',
  'Not active during the look-back',
  'Documented elsewhere',
  'Disagree with the reading',
  'Needs physician clarification'
];

/* Candidate findings the tool surfaced.
   `truth` is NOT shown to the nurse — it drives the facilitator key.
   Point values are the real CMS NTA values. */
const FINDINGS = [
  {
    id:'iv-med', label:'Special Treatments/Programs: Intravenous Medication', points:5, mds:'O0100H2',
    src:'Medication Administration Record', srcShort:'MAR', page:31,
    quote:'Vancomycin 1 g IV every 12 hours for MRSA sacral wound infection.',
    caveat:'Scores only if IV medication continues AFTER admission to the facility. This order is from the hospital stay.',
    truth:'ambiguous'
  },
  {
    id:'tpn', label:'Parenteral IV Feeding: Level Low', points:3, mds:'K0510A2',
    src:'History and Physical', srcShort:'H&P', page:6,
    quote:'TPN discontinued 3/14 after enteral tolerance established; patient now on oral diet.',
    truth:'reject'
  },
  {
    id:'wound-inf', label:'Wound Infection Code', points:2, mds:'I2500',
    src:'Wound Care Consult', srcShort:'Wound Consult', page:41,
    quote:'Sacral wound with purulent exudate and surrounding erythema; wound infection.',
    truth:'confirm'
  },
  {
    id:'dm', label:'Active Diagnoses: Diabetes Mellitus', points:2, mds:'I2900',
    src:'History and Physical', srcShort:'H&P', page:4,
    quote:'Type 2 diabetes mellitus, insulin-dependent, poorly controlled.',
    truth:'confirm'
  },
  {
    id:'copd', label:'Active Diagnoses: Asthma / COPD / Chronic Lung Disease', points:2, mds:'I6200',
    src:'History and Physical', srcShort:'H&P', page:4,
    quote:'COPD, GOLD stage III, on home oxygen 2 L via nasal cannula.',
    truth:'confirm'
  },
  {
    id:'mdro', label:'Active Diagnoses: Multi-Drug Resistant Organism', points:1, mds:'I1700',
    src:'Microbiology Report', srcShort:'Micro', page:42,
    quote:'Methicillin-resistant Staphylococcus aureus isolated from sacral wound culture.',
    truth:'confirm'
  },
  {
    id:'obesity', label:'Morbid Obesity', points:1, mds:'I8000',

function srcForPage(p){ const s = SECTIONS.find(s => p >= s.from && p <= s.to); return s ? s.src : 'Clinical Record'; }

const PACKET = Array.from({length:60}, (_,i) => {
  const n = i + 1, src = srcForPage(n);
  return { n, src, lines: PAGE_CONTENT[n] || [src.toUpperCase(), '', ...(FILLER[src] || ['Continued.'])] };
});

/* ================================================================
   SESSION
   Everything the nurse does, held in localStorage as she goes so an
   interruption does not lose the session. Disclosed on the page —
   nothing here is captured covertly.
   ================================================================ */
const KEY = 'intake-ninja-session-v1';

const blankSession = () => ({
  startedAt: new Date().toISOString(),
  decisions: {},     // id -> {status, reason, note, at, msSpent, order}
  added: [],         // findings the NURSE says we missed  <- the backlog
  order: [],         // the sequence she actually worked in
  events: []         // lightweight trail: views, tab switches
});

let S = load();
function load(){
  try { const raw = localStorage.getItem(KEY); if (raw) return Object.assign(blankSession(), JSON.parse(raw)); }
  catch(e){ /* corrupted or unavailable storage: start clean rather than fail */ }
  return blankSession();
}
function save(){ try { localStorage.setItem(KEY, JSON.stringify(S)); } catch(e){} }
function ev(type, detail){ S.events.push({ type, detail, at: Date.now() }); save(); }

/* Time-per-finding. Timer starts when a finding first becomes visible
   to her and stops on decision, so we can answer the question that
   worries us: does rejecting cost three times what confirming costs? */
const seen = {};
function touch(id){ if (!seen[id]) seen[id] = Date.now(); }
function elapsed(id){ return seen[id] ? Date.now() - seen[id] : null; }

function decide(id, status, reason, note){
  const order = S.order.length + 1;
  S.decisions[id] = { status, reason: reason || null, note: note || null,
                      at: new Date().toISOString(), msSpent: elapsed(id), order };
  if (!S.order.includes(id)) S.order.push(id);
  save(); render();
}
function undecide(id){ delete S.decisions[id]; S.order = S.order.filter(x => x !== id); save(); render(); }

/* ================================================================
   BAND MATHS — the thing no competitor displays
   ================================================================ */
function confirmedFindings(){
  return FINDINGS.filter(f => S.decisions[f.id] && S.decisions[f.id].status === 'confirm')
    .concat(S.added.filter(a => a.counts !== false));
}
function confirmedPoints(){ return confirmedFindings().reduce((t,f) => t + (Number(f.points)||0), 0); }
function bandFor(pts){ return BANDS.find(b => pts >= b.min && pts <= b.max) || BANDS[BANDS.length-1]; }

/* How many points to the next band up, and what that band is.
   Returns null at NA, where there is nothing above. */
function toNextBand(pts){
  const i = BANDS.findIndex(b => pts >= b.min && pts <= b.max);
  if (i <= 0) return null;                 // already NA
  const next = BANDS[i-1];
  return { need: next.min - pts, band: next };
}

/* ================================================================
   RENDER
   ================================================================ */
let TAB = 'review';
let openReject = null;   // id whose reason panel is open
let openRow = null;      // id whose row is expanded

const esc = s => String(s==null?'':s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function tabs(){
  const rejN = Object.values(S.decisions).filter(d => d.status === 'reject').length;
  const t = [
    ['review','Review', FINDINGS.length - Object.keys(S.decisions).length],
    ['rejections','Rejection log', rejN],
    ['gaps','Not found', GAPS.length],
    ['artefact','Artefact', null]
  ];
  document.getElementById('tabs').innerHTML = t.map(([k,l,n]) =>
    `<button class="tab ${TAB===k?'on':''}" onclick="setTab('${k}')">${esc(l)}${
      n!==null ? `<span class="pill">${n}</span>` : ''}</button>`).join('');
}
function setTab(k){ TAB = k; openReject = null; openRow = null; ev('tab', k); render(); window.scrollTo(0,0); }

/* ---- the band display ---- */
function bandView(){
  const pts = confirmedPoints(), b = bandFor(pts), nx = toNextBand(pts);
  const ladder = BANDS.slice().reverse().map(x =>
    `<div class="rung ${x.code===b.code?'on':''}">${x.code}</div>`).join('');
  const nextLine = nx
    ? `<b>${nx.need} more point${nx.need===1?'':'s'}</b> reaches band <b>${nx.band.code}</b>.`
    : `This is the top band. Nothing above it.`;
  return `<section class="band">
    <div class="lede">Confirmed so far</div>
    <div class="row">
      <div class="pts">${pts}<small style="font-family:var(--body);font-size:12px;font-weight:700;letter-spacing:.08em;color:var(--text-3)">POINTS</small></div>
      <div class="code">${b.code}<small>CASE-MIX BAND · INDEX ${b.cmi.toFixed(2)}</small></div>
    </div>
    <div class="next">${nextLine}</div>
    <div class="ladder">${ladder}</div>
    <div class="caution">NTA pays by band, not by point. A point that crosses a boundary changes
      payment; a point inside a band does not. This total counts only what you have confirmed.</div>
  </section>`;
}

/* ---- one finding row: a single scannable line ----
   Citation uses the standard clinical short form (MAR, H&P, Micro) so it is
   ALWAYS fully visible and never truncated — the full source name is shown on
   expand and in the artefact. Tapping the row opens the full quote, the
   caveat, and the reason chips. */
function findRow(f){
  const d = S.decisions[f.id];
  touch(f.id);
  const open = openRow === f.id;
  const cls = (d ? (d.status==='confirm' ? 'done' : 'rej') : '') + (open ? ' open' : '');

  let acts;
  if (d && d.status === 'confirm'){
    acts = `<span class="state ok">Confirmed</span>
      <button class="btn" onclick="stop(event);undecide('${f.id}')">Undo</button>`;
  } else if (d && d.status === 'reject'){
    acts = `<span class="state no">Rejected</span>
      <button class="btn" onclick="stop(event);undecide('${f.id}')">Undo</button>`;
  } else {
    acts = `<button class="btn confirm" onclick="stop(event);decide('${f.id}','confirm')">Confirm</button>
      <button class="btn reject" onclick="stop(event);askReject('${f.id}')">Reject</button>
      <button class="btn" onclick="stop(event);viewPage(${f.page},'${f.id}')">Page</button>`;
  }

  const cite = `${esc(f.srcShort || f.src)} · <b>p.${f.page}</b>`;

  return `<article class="find ${cls}" id="f-${f.id}" onclick="toggleRow('${f.id}')">
      <div class="pts">${f.points}<i>PTS</i></div>
      <div class="label" title="${esc(f.label)}">${esc(f.label)}</div>
      <div class="q">${f.caveat ? '\u25B3 ' : ''}“${esc(f.quote)}”</div>
      <div class="cit">${cite}</div>
      <div class="acts">${acts}</div>
      ${open ? detail(f, d) : ''}
    </article>`;
}

/* Expanded detail: the full quote, the full source name, the caveat, and —
   when rejecting — the reason chips, so rejection stays TWO taps. */
function detail(f, d){
  return `<div class="detail" onclick="stop(event)">
    <div class="full">“${esc(f.quote)}”</div>
    <div class="meta"><b>${esc(f.src)}</b> · page ${f.page} · MDS <b>${esc(f.mds)}</b></div>
    ${f.caveat ? `<div class="caveat"><b>\u25B3 Check before you confirm:</b> ${esc(f.caveat)}</div>` : ''}
    ${openReject === f.id ? rejectPanel(f) : ''}
    <div class="acts" style="margin-top:11px">
      <button class="btn" onclick="stop(event);viewPage(${f.page},'${f.id}')">View the page</button>
    </div>
  </div>`;
}

function stop(e){ if(e) e.stopPropagation(); }
function toggleRow(id){ openRow = (openRow===id) ? null : id; if(openRow!==id) openReject=null; ev('row', id); render(); }

/* Reject in two taps. Inline, never a blocking modal — if this feels
   heavy the nurse stops rejecting, and the rejection record is the
   only ground no competitor holds. */
function rejectPanel(f){
  return `<div class="rej-panel">
    <div class="ask">Why are you rejecting this? One tap is enough.</div>
    <div class="chips">
      ${REASONS.map(r => `<button class="chip" onclick="doReject('${f.id}', this.textContent.trim())">${esc(r)}</button>`).join('')}
    </div>
    <textarea id="rn-${f.id}" placeholder="Anything you want to add (optional)"></textarea>
    <div class="acts">
      <button class="btn" onclick="doReject('${f.id}','Other', true)">Save with my note only</button>
      <button class="btn" onclick="openReject=null;render()">Cancel</button>
    </div>
  </div>`;
}
function askReject(id){ openReject = id; openRow = id; ev('reject-open', id); render();
  const el = document.getElementById('f-'+id); if (el) el.scrollIntoView({block:'center', behavior:'smooth'}); }
function doReject(id, reason, noteOnly){
  /* still two taps: [Reject] opens the row with chips, one chip saves */
  const ta = document.getElementById('rn-'+id);
  const note = ta ? ta.value.trim() : '';
  if (noteOnly && !note){ alert('Add a note, or choose one of the reasons above.'); return; }
  openReject = null; openRow = null;
  decide(id, 'reject', reason, note);
}

/* ---- page viewer: the quote must be findable in one click ---- */
function viewPage(n, fromId){
  const pg = PACKET.find(p => p.n === n); if (!pg) return;
  ev('view-page', {page:n, finding:fromId||null});
  const f = FINDINGS.find(x => x.id === fromId);
  const needle = f ? f.quote.trim() : null;
  const body = pg.lines.map(l => {
    if (!needle) return esc(l);
    const key = needle.replace(/[.,;]$/,'').slice(0, 40);
    return l.includes(key.slice(0,30)) ? `<mark>${esc(l)}</mark>` : esc(l);
  }).join('\n');
  document.getElementById('sheetTitle').textContent = `${pg.src} · p.${pg.n}`;
  document.getElementById('sheetDoc').innerHTML =
    `<div class="page"><div class="ph"><span>${esc(pg.src)}</span>
       <span>HOLLOWAY, MARGARET T. (FICTIONAL) · SAMPLE-000-0000</span></div>
     <pre style="margin:0;font:inherit;white-space:pre-wrap">${body}</pre>
     <div class="pf">Page ${pg.n} of ${PATIENT.packetPages} — fictional document, sample data</div></div>`;
  document.getElementById('sheet').classList.add('on');
}
function closeSheet(){ document.getElementById('sheet').classList.remove('on'); }

/* ---- add a finding WE missed: the extraction backlog, written by
        the only person qualified to write it ---- */
function addMissView(){
  return `<section class="art" id="addmiss">
    <h3>Did we miss something?</h3>
    <div class="sub">If you find an NTA item in the packet that we did not flag, tell us here.
      This is the most useful thing you can give us.</div>
    <label class="field"><span>What is the item?</span>
      <input id="am-label" placeholder="e.g. Intermittent catheterisation"></label>
    <div style="display:flex;gap:10px;flex-wrap:wrap">
      <label class="field" style="flex:1;min-width:120px"><span>Points</span>
        <input id="am-points" type="number" min="0" max="8" value="1" inputmode="numeric"></label>
      <label class="field" style="flex:1;min-width:120px"><span>Page</span>
        <input id="am-page" type="number" min="1" max="60" inputmode="numeric"></label>
      <label class="field" style="flex:1;min-width:120px"><span>MDS item (if known)</span>
        <input id="am-mds" placeholder="e.g. H0100D"></label>
    </div>
    <label class="field"><span>What in the record supports it?</span>
      <textarea id="am-why" rows="3" placeholder="Quote or describe what you saw"></textarea></label>
    <button class="btn primary" onclick="addMiss()">Add this item</button>
    ${S.added.length ? `<div style="margin-top:14px">${S.added.map((a,i) =>
      `<div class="item"><div class="l">${esc(a.label)} — ${a.points} point${a.points==1?'':'s'}
        ${a.mds?`<span class="muted">· MDS ${esc(a.mds)}</span>`:''}</div>
       <div class="cite"><span class="src">Found by reviewer</span>
         <span class="pg">· p.${esc(a.page||'—')} ·</span>
         <span class="q">“${esc(a.why||'')}”</span></div>
       <button class="btn" style="margin-top:8px" onclick="rmMiss(${i})">Remove</button></div>`).join('')}</div>` : ''}
  </section>`;
}
function addMiss(){
  const g = id => (document.getElementById(id)||{}).value;
  const label = (g('am-label')||'').trim();
  if (!label){ alert('What is the item?'); return; }
  S.added.push({ label, points: Number(g('am-points'))||0, page: g('am-page')||null,
                 mds:(g('am-mds')||'').trim()||null, why:(g('am-why')||'').trim(),
                 at:new Date().toISOString(), counts:true });
  ev('added-miss', label); save(); render();
}
function rmMiss(i){ S.added.splice(i,1); save(); render(); }

/* ---- rejection log: a first-class view, not a footnote ---- */
function rejectionsView(){
  const rows = FINDINGS.filter(f => S.decisions[f.id] && S.decisions[f.id].status==='reject');
  return `<h2 class="sec-h">Rejection log</h2>
    <div class="note-line">This is the record that shows a human reviewed the packet. A facility that
      accepted every suggestion looks automated; one that declined some of them looks clinical.
      It is kept with the artefact.</div>
    ${rows.length ? rows.map(f => { const d = S.decisions[f.id];
      return `<article class="find rej"><div class="top">
        <div class="pts" style="color:var(--no)">${f.points}<small>POINTS</small></div>
        <div class="body">
          <div class="label">${esc(f.label)}</div>
          <div class="mds">MDS ${esc(f.mds)}</div>
          <div class="cite"><span class="src">${esc(f.src)}</span>
            <span class="pg">· p.${f.page} ·</span><span class="q">“${esc(f.quote)}”</span></div>
          <div style="margin-top:9px"><span class="state no">Rejected</span>
            <b style="margin-left:8px">${esc(d.reason||'')}</b></div>
          ${d.note ? `<div class="muted" style="margin-top:5px">“${esc(d.note)}”</div>` : ''}
          <div class="muted" style="margin-top:5px">Recorded ${esc(new Date(d.at).toLocaleString())}</div>
          <div class="acts"><button class="btn" onclick="undecide('${f.id}')">Undo</button></div>
        </div></div></article>`; }).join('')
      : `<div class="empty">Nothing rejected yet. If a flag is not supported by the record, reject it —
          that is the part of this we most want to learn from.</div>`}`;
}

/* ---- what we did NOT find ---- */
function gapsView(){
  return `<h2 class="sec-h">What we did not find</h2>
    <div class="note-line">Silence is the dangerous failure. Where the packet does not support something,
      it is said here rather than left out.</div>
    ${GAPS.map(g => `<div class="gap"><div class="t">${esc(g.t)}</div><div class="w">${esc(g.w)}</div></div>`).join('')}`;
}

/* ---- the artefact: assembled in the order a reviewer reads it ---- */
function artefactView(){
  const conf = FINDINGS.filter(f => S.decisions[f.id] && S.decisions[f.id].status==='confirm');
  const rej  = FINDINGS.filter(f => S.decisions[f.id] && S.decisions[f.id].status==='reject');
  const und  = FINDINGS.filter(f => !S.decisions[f.id]);
  const pts = confirmedPoints(), b = bandFor(pts);

  const sect = k => conf.concat(S.added).filter(f => (f.mds||'').charAt(0) === k);

  return `<h2 class="sec-h">Review worksheet</h2>

  </section>

  <section class="art">
    <h3>Confirmed items, with source</h3>

    ${conf.length||S.added.length ? conf.map(f => `<div class="item">
      <div class="l">${esc(f.label)} — ${f.points} point${f.points===1?'':'s'} <span class="muted">· MDS ${esc(f.mds)}</span></div>

        <span class="q">“${esc(f.quote)}”</span></div>
      <div class="muted" style="margin-top:5px">Confirmed ${esc(new Date(S.decisions[f.id].at).toLocaleString())}</div>
    </div>`).join('') + S.added.map(a => `<div class="item">
      <div class="l">${esc(a.label)} — ${a.points} point${a.points===1?'':'s'}
        <span class="muted">· added by reviewer${a.mds?' · MDS '+esc(a.mds):''}</span></div>
      <div class="cite"><span class="src">Found by reviewer</span>
        <span class="pg">· p.${esc(a.page||'—')} ·</span><span class="q">“${esc(a.why||'')}”</span></div>
    </div>`).join('') : '<div class="empty">Nothing confirmed yet.</div>'}
  </section>

  <section class="art">
    <h3>Rejected items, and why</h3>
    <div class="sub">The page that shows judgement was applied.</div>
    ${rej.length ? rej.map(f => { const d=S.decisions[f.id]; return `<div class="item">
      <div class="l">${esc(f.label)} — ${f.points} point${f.points===1?'':'s'} declined</div>
      <div class="cite"><span class="src">${esc(f.src)}</span> <span class="pg">· p.${f.page} ·</span>
        <span class="q">“${esc(f.quote)}”</span></div>
      <div style="margin-top:6px"><b>Reason:</b> ${esc(d.reason||'')}${d.note?` — “${esc(d.note)}”`:''}</div>
      <div class="muted" style="margin-top:4px">Recorded ${esc(new Date(d.at).toLocaleString())}</div>
    </div>`; }).join('') : '<div class="empty">No rejections recorded.</div>'}
  </section>

  <section class="art">
    <h3>Query list — items that failed for want of documentation</h3>
    <div class="sub">Raised at admission, not on appeal.</div>
    ${GAPS.map(g => `<div class="item"><div class="l">${esc(g.t)}</div>
      <div class="muted">${esc(g.w)}</div></div>`).join('')}
  </section>

  <section class="art">
    <h3>MDS worksheet</h3>
    <div class="sub">Confirmed items in MDS item order — the order you key them. A worksheet, not a submission.</div>
    <div class="scroll-x"><table class="wk">
      <tr><th>MDS item</th><th>Finding</th><th>Points</th><th>Source</th></tr>
      ${MDS_SECTIONS.map(s => { const rows = sect(s.key); return rows.length
        ? `<tr><td colspan="4" style="background:var(--bg);font-weight:700;font-size:12.5px">${esc(s.title)}</td></tr>`
          + rows.map(f => `<tr><td><code>${esc(f.mds||'—')}</code></td><td>${esc(f.label)}</td>
              <td>${f.points}</td><td>${esc(f.src||'Reviewer')} p.${esc(f.page||'—')}</td></tr>`).join('')
        : ''; }).join('')}
      ${conf.length||S.added.length ? '' : '<tr><td colspan="4" class="muted">Nothing confirmed yet.</td></tr>'}
    </table></div>
    <div class="never"><b>This tool never submits.</b> It does not code, does not score the MDS and does
      not write to any system. Everything above is a suggestion for a person to accept, decline or correct.</div>

}

/* ---- MDS item ordering ----
   Data-entry order, not points order. She goes down her EHR screen section by
   section: H, I, K, M, O. Points order is for DECIDING; item order is for KEYING. */
const SECTION_ORDER = ['H','I','K','M','O'];
function mdsSortKey(item){
  const m = String(item||'').match(/^([A-Z])(\d+)(.*)$/);
  if (!m) return [99, 99999, String(item||'')];
  const sec = SECTION_ORDER.indexOf(m[1]);
  return [sec === -1 ? 98 : sec, parseInt(m[2],10), m[3]];
}
function byMdsItem(a,b){
  const ka = mdsSortKey(a.mds), kb = mdsSortKey(b.mds);
  for (let i=0;i<3;i++){ if (ka[i] < kb[i]) return -1; if (ka[i] > kb[i]) return 1; }
  return 0;
}

/* ---- THE PDF: a worksheet she keys FROM. Never a submission. ----
   Built into the DOM, hidden on screen, revealed only by the print stylesheet,
   so Chrome's print-to-PDF renders it without any PDF library. */
function buildPrintDoc(){
  const conf = FINDINGS.filter(f => S.decisions[f.id] && S.decisions[f.id].status==='confirm');
  const rej  = FINDINGS.filter(f => S.decisions[f.id] && S.decisions[f.id].status==='reject');
  const all  = conf.concat(S.added.filter(a => a.counts !== false));
  const pts  = confirmedPoints(), b = bandFor(pts);
  const when = new Date().toLocaleString();
  const banner = '<div class="ph-banner">Sample data — fictional patient — not a real record</div>';

  const worksheet = all.slice().sort(byMdsItem).map(f => `<tr>
      <td><b>${esc(f.mds || '—')}</b></td>
      <td>${esc(f.label)}</td>
      <td style="text-align:right">${f.points}</td>
      <td>${esc(f.src || 'Added by reviewer')}${f.page ? ', p.'+f.page : ''}</td>
      <td style="width:56px"></td></tr>`).join('');

  const evidence = conf.map(f => `<div class="ev">
      <div class="l">${esc(f.label)} — ${f.points} point${f.points===1?'':'s'} · MDS ${esc(f.mds)}</div>
      <div class="c">${esc(f.src)} · p.${f.page} · <i>“${esc(f.quote)}”</i></div>
      <div class="why">Confirmed by reviewer, ${esc(new Date(S.decisions[f.id].at).toLocaleString())}</div>
    </div>`).join('') + S.added.map(a => `<div class="ev">
      <div class="l">${esc(a.label)} — ${a.points} point${a.points===1?'':'s'}${a.mds?' · MDS '+esc(a.mds):''}</div>
      <div class="c">Identified by the reviewer${a.page?', p.'+esc(a.page):''} · <i>“${esc(a.why||'')}”</i></div>
    </div>`).join('');

  const declined = rej.map(f => { const d=S.decisions[f.id]; return `<div class="ev">
      <div class="l">${esc(f.label)} — ${f.points} point${f.points===1?'':'s'} DECLINED</div>
      <div class="c">${esc(f.src)} · p.${f.page} · <i>“${esc(f.quote)}”</i></div>
      <div class="why"><b>Reason:</b> ${esc(d.reason||'')}${d.note?` — “${esc(d.note)}”`:''}
        <br>Declined by reviewer, ${esc(new Date(d.at).toLocaleString())}</div>
    </div>`; }).join('');

  const queries = GAPS.map(g => `<div class="ev"><div class="l">${esc(g.t)}</div>
      <div class="why">${esc(g.w)}</div></div>`).join('');

  document.getElementById('printdoc').innerHTML = `
    ${banner}
    <h1>NTA Review Worksheet</h1>
    <div class="sub">${esc(PATIENT.name)} · ${esc(PATIENT.mrn)}<br>
      ${esc(PATIENT.from)} → ${esc(PATIENT.to)} · ${esc(PATIENT.received)}<br>
      Reviewed ${esc(when)} · Confirmed total ${pts} points — NTA band ${b.code}</div>

    <h2>1 · MDS worksheet — key these in</h2>
    <div class="sub">Listed in MDS item order, the order you work down the assessment.
      Tick each one as you key it. <b>This worksheet is not a submission and nothing here has
      been sent anywhere.</b></div>
    <table>
      <tr><th>MDS item</th><th>Condition / service</th><th>Pts</th><th>Source</th><th>Keyed</th></tr>
      ${worksheet || '<tr><td colspan="5">No items confirmed.</td></tr>'}
    </table>

    <h2>2 · Evidence packet</h2>
    <h3>Confirmed items, with source and quotation</h3>
    ${evidence || '<div class="ev"><div class="why">No items confirmed.</div></div>'}
    <h3>Items declined by the reviewer, and why</h3>
    ${declined || '<div class="ev"><div class="why">No items were declined.</div></div>'}
    <h3>Query list — items that failed for want of documentation</h3>
    ${queries}

    <div class="sig">Reviewed by: ________________________________
      &nbsp;&nbsp; Title: ______________ &nbsp;&nbsp; Date: ____________</div>
    <div class="foot"><b>This is a review worksheet, not a submission.</b>
      No assessment has been coded, scored or transmitted. MDS assessments are generated and
      transmitted to CMS by the facility's own EHR. Every item above is a suggestion for a
      qualified reviewer to accept, decline or correct, and the reviewer's decisions are recorded
      as shown. Sample data — fictional patient — not a real record.</div>`;
}

function printArtefact(){ ev('print-artefact', confirmedPoints()); buildPrintDoc(); window.print(); }

/* ---- export: available throughout, not only at the end ---- */
function exportSession(){
  const payload = {
    tool:'Intake Ninja prototype', sampleData:true, patient:PATIENT.name,
    startedAt:S.startedAt, exportedAt:new Date().toISOString(),
    confirmedPoints:confirmedPoints(), band:bandFor(confirmedPoints()).code,
    decisions:FINDINGS.map(f => ({ id:f.id, label:f.label, points:f.points, mds:f.mds,
      page:f.page, decision:S.decisions[f.id]||null })),
    addedByReviewer:S.added, workedInOrder:S.order, events:S.events
  };
  const json = JSON.stringify(payload, null, 2);
  const d = Object.values(S.decisions);

  /* True median, not a mean. The question this answers — does rejecting
     cost more than confirming — is distorted by one interrupted decision,
     and a median survives that where an average does not. */
  const medianMs = k => {
    const v = d.filter(x => x.status === k && x.msSpent).map(x => x.msSpent).sort((a,b) => a-b);
    if (!v.length) return null;
    const m = Math.floor(v.length/2);
    return v.length % 2 ? v[m] : Math.round((v[m-1]+v[m])/2);
  };
  const secs = ms => ms == null ? null : Math.round(ms/100)/10;
  const cMs = medianMs('confirm'), rMs = medianMs('reject');
  const cS = secs(cMs), rS = secs(rMs);

  /* The comparison Artemis asked to watch, stated outright rather than
     left for someone to compute out of the JSON. */
  let costLine;
  if (cMs == null || rMs == null) {
    costLine = `Median time — confirm ${cS==null?'no data':cS+'s'}, reject ${rS==null?'no data':rS+'s'} (need at least one of each to compare)`;
  } else {
    const ratio = cMs === 0 ? null : Math.round((rMs/cMs)*10)/10;
    const verdict = ratio == null ? ''
      : ratio >= 1.05 ? `  →  rejecting costs ${ratio}x a confirm`
      : ratio <= 0.95 ? `  →  rejecting is faster than confirming (${ratio}x)`
      : '  →  about the same';
    costLine = `Median time — CONFIRM ${cS}s vs REJECT ${rS}s${verdict}`;
  }

  const summary = [
    `Confirmed ${d.filter(x=>x.status==='confirm').length} · Rejected ${d.filter(x=>x.status==='reject').length} · Added ${S.added.length}`,
    `Score ${confirmedPoints()} points — band ${bandFor(confirmedPoints()).code}`,
    costLine,
    `Worked in this order: ${S.order.join(', ')||'—'}`
  ].join('\n');
  TAB='export'; window.__export = {json, summary}; render(); window.scrollTo(0,0);
}
function exportView(){
  const e = window.__export || {json:'', summary:''};
  return `<h2 class="sec-h">Session data for the build team</h2>
    <div class="note-line">This is for the build team, not for the resident record. Copy it out and send it back.</div>
    <section class="art"><h3>Summary</h3><pre style="white-space:pre-wrap;font-size:14px">${esc(e.summary)}</pre></section>
    <section class="art"><h3>Full session (JSON)</h3>
      <textarea class="exportbox" readonly onclick="this.select()">${esc(e.json)}</textarea>
      <div class="acts"><button class="btn primary" onclick="copyJson()">Copy to clipboard</button>
        <button class="btn" onclick="setTab('review')">Back to review</button></div></section>`;
}
function copyJson(){
  const t = document.querySelector('.exportbox'); if(!t) return;
  t.select(); try{ document.execCommand('copy'); }catch(e){}
  if (navigator.clipboard) navigator.clipboard.writeText(t.value).catch(()=>{});
  alert('Copied.');
}

/* ---- review tab ---- */
function reviewView(){
  const pending = FINDINGS.filter(f => !S.decisions[f.id]).sort((a,b)=>b.points-a.points);
  const done = FINDINGS.filter(f => S.decisions[f.id]).sort((a,b)=>b.points-a.points);
  return bandView()
    + `<div class="note-line">This session records which items you confirm or reject, the reason you give,
        how long each one takes and the order you work in — so we can improve the tool. Nothing is
        recorded about you, and nothing leaves this device until you export it.</div>`
    + `<h2 class="sec-h">Candidates — ${pending.length} to review</h2>`
    + (pending.length ? pending.map(findRow).join('') : `<div class="empty">Every candidate has a decision.</div>`)
    + (done.length ? `<h2 class="sec-h">Decided</h2>` + done.map(findRow).join('') : '')
    + addMissView();
}

function render(){
  tabs();
  const v = TAB==='review' ? reviewView()
          : TAB==='rejections' ? rejectionsView()
          : TAB==='gaps' ? gapsView()
          : TAB==='artefact' ? artefactView()
          : exportView();
  document.getElementById('main').innerHTML = v;
}
document.getElementById('printBtn').addEventListener('click', printArtefact);
var __rl = document.getElementById('researchLink');
if (__rl) __rl.addEventListener('click', function(e){ e.preventDefault(); exportSession(); });
document.getElementById('sheet').addEventListener('click', e => { if (e.target.id==='sheet') closeSheet(); });
render();
</script>
